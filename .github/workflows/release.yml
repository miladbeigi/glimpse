name: Release

# Run scripts/release.sh <version> (or push a tag like v1.1.0) to publish a release.
# install.sh and the app's self-updater both read the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build universal app and zip
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
        run: scripts/build.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Glimpse-*.zip build/Glimpse-*.zip.sha256 \
            --title "Glimpse $GITHUB_REF_NAME" --generate-notes
