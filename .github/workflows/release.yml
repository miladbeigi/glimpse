name: Release

# Run scripts/release.sh <version> (or push a tag like v1.1.0) to publish a release.
# install.sh and the app's self-updater both read the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_SIGNING_IDENTITY: ${{ secrets.GLIMPSE_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      # Releases carry the same shared identity as local builds on every Mac (scripts/setup-signing.sh --github,
      # pinned in scripts/signing-identity): macOS ties Screen Recording and Microphone permission to it, so any
      # other signature would ask for them again. No release without it.
      - name: Import signing identity
        env:
          P12: ${{ secrets.GLIMPSE_SIGNING_P12 }}
          PASSWORD: ${{ secrets.GLIMPSE_SIGNING_PASSWORD }}
        run: |
          [ "$HAS_SIGNING_IDENTITY" = true ] || { echo "::error::GLIMPSE_SIGNING_P12 isn't set: run scripts/setup-signing.sh --github"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/id.p12" -k "$KC" -P "$PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          # By hash: the self-signed certificate isn't trusted, so codesign won't resolve it by name.
          PINNED="$(tr -d '[:space:]' < scripts/signing-identity)"
          security find-identity -p codesigning "$KC" | grep -q "$PINNED" \
            || { echo "::error::the GLIMPSE_SIGNING_P12 secret isn't the pinned identity $PINNED (scripts/setup-signing.sh --github)"; exit 1; }
          echo "GLIMPSE_SIGN_IDENTITY=$PINNED" >> "$GITHUB_ENV"
      - name: Build universal app and zip
        env:
          VERSION: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
        run: scripts/build.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Glimpse-*.zip build/Glimpse-*.zip.sha256 \
            --title "Glimpse $GITHUB_REF_NAME" --generate-notes
