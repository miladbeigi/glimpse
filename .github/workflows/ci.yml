name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build.sh --zip
      - uses: actions/upload-artifact@v7
        with:
          name: Glimpse
          path: build/Glimpse-*.zip*
